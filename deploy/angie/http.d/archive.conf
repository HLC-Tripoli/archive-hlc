# =============================================================================
# موقع الأرشيف الإلكتروني:
#   - ملفات الواجهة الثابتة (عربية RTL)
#   - توكيل /api/ إلى خدمة Fastify الداخلية على api:3000
#   - رؤوس أمان صارمة + سياسة CSP تسمح فقط بموارد self (لا سكربتات مضمّنة)
# =============================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/angie/html;
    index index.html;

    # فحص صحة الحاوية (يستخدمه Docker Compose)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # حظر الوصول إلى الملفات المخفية
    location ~ /\.(?!well-known) {
        deny all;
    }

    # حماية خصوصية المرفقات: لا يُقدَّم أي ملف من مسارات تخزين المرفقات عبر
    # الواجهة الثابتة. المرفقات توصل إليها الواجهة فقط عبر
    # /api/v1/files/:id/download بعد التحقق من الجلسة والصلاحية.
    location ^~ /uploads/ {
        include /etc/angie/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # -------------------------------------------------------------------------
    # واجهة برمجة التطبيقات: توكيل إلى خدمة api الداخلية
    #   - الاستجابات الحساسة لا تُخزَّن مؤقتاً إطلاقاً
    #   - رؤوس الأمان تُعاد صراحةً لأن تعريف add_header في هذا الموقع
    #     يُلغي توريث رؤوس المستوى الأعلى
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        # مهم: تمرير Host كما أرسله العميل مع المنفذ ($http_host وليس $host)
        # حتى يطابق فحص المصدر في الخادم بين Referer/Origin و Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        include /etc/angie/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # أصول الواجهة الثابتة (CSS/JS/صور): تخزين مؤقت قصير مع إعادة تحقق إلزامية
    # (لا توجد بصمات إصدار في أسماء الملفات، لذا نبقي المدة قصيرة لتصل التحديثات).
    # -------------------------------------------------------------------------
    location ~* \.(?:css|js|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        include /etc/angie/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # صفحات HTML: لا تخزين مؤقت (لتصل تحديثات الواجهة فوراً)
    # -------------------------------------------------------------------------
    location / {
        include /etc/angie/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # صفحة خطأ عربية مبسطة لأعطال الخدمة
    error_page 500 502 503 504 = @maintenance;
    location @maintenance {
        default_type text/html;
        return 503 "<!doctype html><html lang=\"ar\" dir=\"rtl\"><meta charset=\"utf-8\"><title>الخدمة غير متاحة</title><body style=\"font-family:system-ui;text-align:center;padding:80px 20px\"><h1>الخدمة غير متاحة مؤقتاً</h1><p>حدث عطل مؤقت. الرجاء إعادة المحاولة بعد قليل.</p></body></html>";
    }
}
