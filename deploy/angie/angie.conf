# =============================================================================
# إعداد Angie الرئيسي لمنظومة الأرشيف الإلكتروني — هاتف ليبيا
# الواجهة الثابتة تُقدَّم من هذه الصورة، وتوكيل /api/ يذهب إلى خدمة api الداخلية.
# =============================================================================

user  angie;
worker_processes  auto;
worker_rlimit_nofile 65536;

error_log  /var/log/angie/error.log notice;
pid        /run/angie/angie.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/angie/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;
    charset         utf-8;

    # ضغط الاستجابات النصية (HTML/CSS/JS/JSON)
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # الحد الأعلى لحجم جسم الطلب.
    # مهم: يجب أن يبقى أكبر من UPLOAD_MAX_MB في ملف .env (الافتراضي 25Mb).
    # إذا رفعت UPLOAD_MAX_MB فوق 25 فأعد بناء صورة web مع تعديل الرقم في موقع الخادم أدناه.
    client_max_body_size 32m;

    include /etc/angie/http.d/*.conf;
}
