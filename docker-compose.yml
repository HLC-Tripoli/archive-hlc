# =============================================================================
# منظومة الأرشيف الإلكتروني — هاتف ليبيا
# ملف Compose الإنتاجي المستقل: يسحب صوراً جاهزة من GHCR ولا يبني أي صورة محلياً.
#
# ملفات النشر المطلوبة على جهاز النشر (فقط):
#   - docker-compose.yml  (هذا الملف)
#   - .env                (منسوخ من .env.example بعد تعديل القيم)
#
# أوامر النشر:
#   docker compose config     # تحقق من صحة الإعداد بعد تعديل .env
#   docker compose pull       # سحب الصور من GHCR
#   docker compose up -d      # تشغيل المنظومة (db → migrate → api → web)
#
# ملاحظات:
#   - لا يحتوي هذا الملف أي build: ولا يعتمد على شيفرة المصدر — لا نسخ المستودع
#     ولا Dockerfiles ولا Node.js مطلوبة على جهاز النشر.
#   - الصور المنشورة (انظر .env.example): ghcr.io/hlc-tripoli/archive-hlc:api-latest
#     و:web-latest، مع وسوم sha-/v- لتثبيت نسخة محددة (Reproducible pinning).
#   - اسم المشروع `archive-hlc` ثابت هنا عمداً: أسماء الحجم الدائم وأسماء الحاويات
#     لا تتغير حتى لو نُقل مجلد النشر (نقل الملف إلى مسار آخر لا يبدأ قاعدة فارغة).
#   - قاعدة البيانات والخادم داخل شبكة Compose الداخلية فقط؛ المنفذ المنشور الوحيد
#     هو منفذ الواجهة (WEB_PORT). مجلد المرفقات الخاصة غير متاح لحاوية Angie إطلاقاً.
# =============================================================================
name: archive-hlc

services:
  # ---------------------------------------------------------------------------
  # قاعدة البيانات (PostgreSQL 18) — حجم دائم، بلا نشر منافذ خارجي
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hlc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?يجب ضبط POSTGRES_PASSWORD في ملف .env}
      POSTGRES_DB: ${POSTGRES_DB:-archive_hlc}
    volumes:
      # تخطيط PostgreSQL 18: يُوصَل المجلد الأعلى /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      # فحص عبر TCP (127.0.0.1) وليس المقبس المحلي: أثناء تهيئة الصورة الأولية
      # يعمل خادم مؤقت على المقبس فقط، ما يجعل الفحص السطحي "سليماً" قبل جهوزية
      # الخادم الفعلي على الشبكة — وهذا يسبب فشل خدمة الترحيلات بـ ECONNREFUSED.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---------------------------------------------------------------------------
  # خدمة الترحيلات: تعمل مرة واحدة ثم تتوقف بنجاح قبل تشغيل الخادم.
  # تستخدم صورة API المنشورة نفسها (نفس وسم ARCHIVE_API_IMAGE) مع أمر الترحيل.
  # ---------------------------------------------------------------------------
  migrate:
    image: ${ARCHIVE_API_IMAGE:-ghcr.io/hlc-tripoli/archive-hlc:api-latest}
    command: ["node", "dist/db/migrate-cli.js"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # خادم واجهة برمجة التطبيقات (Fastify) — صورة منشورة من GHCR
  # المرفقات تُخزَّن على مجلد المضيف المرتبط (ARCHIVE_UPLOADS_PATH) ضمن حجم دائم،
  # ويصل إليه الخادم وحده عبر المسار الداخلي /data/uploads.
  # ---------------------------------------------------------------------------
  api:
    image: ${ARCHIVE_API_IMAGE:-ghcr.io/hlc-tripoli/archive-hlc:api-latest}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # المرفقات تبقى على المضيف: تصمد أمام إعادة إنشاء الحاوية وترقية الصور.
      # يجب إنشاء المجلد مسبقاً بملكية مستخدم التشغيل (uid=1000) — راجع README.
      - "${ARCHIVE_UPLOADS_PATH:-./archive/files/uploads}:/data/uploads"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # الواجهة الأمامية + الوكيل العكسي (Angie) — صورة منشورة من GHCR
  # المنفذ المنشور الوحيد للخارج هو منفذ الواجهة (افتراضياً 8080).
  # ---------------------------------------------------------------------------
  web:
    image: ${ARCHIVE_WEB_IMAGE:-ghcr.io/hlc-tripoli/archive-hlc:web-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
    driver: local
